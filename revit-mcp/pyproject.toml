[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "revit-mcp-local"
version = "0.1.16"
description = "Local-only stdio MCP adapter for the Revit MCP bridge"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==1.10.1"]

[project.scripts]
revit-mcp = "revit_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
